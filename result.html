<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>선택 결과</title>

  <link rel="stylesheet" href="style.css">

  <script src="data.js"></script>
  <script src="result.js" defer></script>
</head>

<body class="result-page">
  <div class="result-scale-wrap">
    <main class="result-wrapper">
  
      <header class="result-header">
        <div>
          <div class="small-title">
            CONTINGENCY CONTRACT
          </div>
  
          <h1 class="main-title">
            선택 결과
          </h1>
        </div>
  
        <div class="result-total-box">
          <span>총 합계</span>
          <strong id="result-total">0</strong>
          <span>★</span>
        </div>
      </header>
  
      <section class="result-columns">
  
        <section class="result-column team">
          <div class="result-column-title">
            <span>팀 제약</span>
            <span id="team-score">0★</span>
          </div>
  
          <div class="result-list" id="result-team"></div>
        </section>
  
        <section class="result-column control">
          <div class="result-column-title">
            <span>조작 제약</span>
            <span id="control-score">0★</span>
          </div>
  
          <div class="result-list" id="result-control"></div>
        </section>
  
        <section class="result-column env">
          <div class="result-column-title">
            <span>환경 제약</span>
            <span id="env-score">0★</span>
          </div>
  
          <div class="result-list" id="result-env"></div>
        </section>
  
      </section>
      <section class="result-guide">
        <div class="result-guide-title">
          선택 순서 가이드
        </div>
      
        <div class="result-guide-desc">
          왼쪽부터 순서대로 선택하면 동일한 계약을 구성할 수 있습니다.
        </div>
      
        <div class="result-guide-list" id="result-guide-list"></div>
      </section>
    </main>
  </div>
</body>
</html>
