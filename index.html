<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Endfield CC Simulator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="sim-wrapper">
  <header class="sim-header">
    <div class="small-title">// 위기 협약 재점화 실험 작전</div>
    <h1>지표 선택</h1>
  </header>

  <main class="sim-body">
    <section class="board-wrap">
      <div id="grid-area" class="grid-area"></div>
    </section>

    <aside class="side-panel">
      <div class="panel-header">
        <span>선택된 지표</span>
        <span id="selected-count">0</span>
      </div>
      <div id="panel-list" class="panel-list">
        <div class="panel-empty">지표를 선택하면<br>여기에 표시됩니다</div>
      </div>
    </aside>
  </main>

  <footer class="sim-footer">
    <div class="warn-text" id="warn-text">
      ⚠ 현재 지표 난도가 높습니다. 신중하게 행동해 주세요.
    </div>

    <div class="total-score">
      <span>총 합계</span>
      <strong id="total-pts">0</strong>
      <span>★</span>
    </div>
  </footer>
</div>

<script>
const ROWS = [
  {
    tier: 1,
    cards: [
      { id:'1-1',  col:1,  icon:'▦', name:'그룹 1 - I', pts:1, group:'g1', lineBottom:true, desc:'1번 세로 그룹 I' },
      { id:'1-2',  col:2,  icon:'▴', name:'그룹 2 - I', pts:1, group:'g2', lineBottom:true, desc:'2번 세로 그룹 I' },
      { id:'1-3',  col:3,  icon:'◴', name:'그룹 3 - I', pts:1, group:'g3', lineBottom:true, desc:'3번 세로 그룹 I' },
      { id:'1-4',  col:4,  icon:'✹', name:'그룹 4 - I', pts:1, group:'g4', lineBottom:true, desc:'4번 세로 그룹 I' },
      { id:'1-5',  col:5,  icon:'▣', name:'그룹 5 - I', pts:1, group:'g5', lineBottom:true, desc:'5번 세로 그룹 I' },
      { id:'1-6',  col:6,  icon:'◒', name:'그룹 6 - I', pts:1, group:'g6', lineBottom:true, desc:'6번 세로 그룹 I' },
      { id:'1-7',  col:7,  icon:'⌁', name:'그룹 7 - I', pts:1, group:'g7', lineBottom:true, desc:'7번 세로 그룹 I' },
      { id:'1-8',  col:8,  icon:'✚', name:'그룹 8 - I', pts:1, group:'g8', lineBottom:true, desc:'8번 세로 그룹 I' },
      { id:'1-9',  col:9,  icon:'◎', name:'그룹 9 - I', pts:1, group:'g9', lineBottom:true, desc:'9번 세로 그룹 I' },

      { empty:true, col:10 },
      { empty:true, col:11 },
      { empty:true, col:12 },

      { id:'1-13', col:13, icon:'▧', name:'잠금 지표 A', pts:2, locked:true },
      { id:'1-14', col:14, icon:'◉', name:'잠금 지표 B', pts:2, locked:true },
    ]
  },
  {
    tier: 2,
    cards: [
      { id:'2-1',  col:1,  icon:'▦', name:'그룹 1 - II', pts:2, group:'g1', lineTop:true, lineBottom:true, desc:'1번 세로 그룹 II' },
      { id:'2-2',  col:2,  icon:'▴', name:'그룹 2 - II', pts:2, group:'g2', lineTop:true, desc:'2번 세로 그룹 II' },
      { id:'2-3',  col:3,  icon:'◴', name:'그룹 3 - II', pts:2, group:'g3', lineTop:true, desc:'3번 세로 그룹 II' },
      { id:'2-4',  col:4,  icon:'✹', name:'그룹 4 - II', pts:2, group:'g4', lineTop:true, lineBottom:true, desc:'4번 세로 그룹 II' },
      { id:'2-5',  col:5,  icon:'▣', name:'그룹 5 - II', pts:2, group:'g5', lineTop:true, desc:'5번 세로 그룹 II' },
      { id:'2-6',  col:6,  icon:'◒', name:'그룹 6 - II', pts:2, group:'g6', lineTop:true, desc:'6번 세로 그룹 II' },

      { empty:true, col:7 },

      { id:'2-8',  col:8,  icon:'✚', name:'그룹 8 - II', pts:2, group:'g8', lineTop:true, desc:'8번 세로 그룹 II' },
      { id:'2-9',  col:9,  icon:'◎', name:'그룹 9 - II', pts:2, group:'g9', lineTop:true, lineBottom:true, desc:'9번 세로 그룹 II' },

      { id:'2-10', col:10, icon:'✹', name:'단독 지표 1', pts:2, desc:'그룹이 아닌 단독 지표입니다.' },
      { id:'2-11', col:11, icon:'▧', name:'단독 지표 2', pts:2, desc:'그룹이 아닌 단독 지표입니다.' },

      { empty:true, col:12 },

      { id:'2-13', col:13, icon:'◎', name:'잠금 지표 C', pts:2, locked:true },
      { id:'2-14', col:14, icon:'◉', name:'잠금 지표 D', pts:2, locked:true },
    ]
  },
  {
    tier: 3,
    cards: [
      { id:'3-1',  col:1,  icon:'▦', name:'그룹 1 - III', pts:3, group:'g1', lineTop:true, desc:'1번 세로 그룹 III' },

      { empty:true, col:2 },
      { empty:true, col:3 },

      { id:'3-4',  col:4,  icon:'✹', name:'그룹 4 - III', pts:3, group:'g4', lineTop:true, desc:'4번 세로 그룹 III' },

      { empty:true, col:5 },
      { empty:true, col:6 },

      { id:'3-7',  col:7,  icon:'◒', name:'단독 지표 3', pts:3, desc:'그룹이 아닌 단독 지표입니다.' },

      { empty:true, col:8 },

      { id:'3-9',  col:9,  icon:'⚔', name:'그룹 9 - III', pts:3, group:'g9', lineTop:true, desc:'9번 세로 그룹 III' },

      { id:'3-10', col:10, icon:'♟', name:'단독 지표 4', pts:3, desc:'그룹이 아닌 단독 지표입니다.' },

      { id:'3-11', col:11, icon:'🔑', name:'노란 열쇠 I', pts:3, group:'yellow-key', key:true, lineRight:true, desc:'둘 중 하나만 선택 가능한 노란 열쇠 그룹입니다.' },
      { id:'3-12', col:12, icon:'🗝', name:'노란 열쇠 II', pts:3, group:'yellow-key', key:true, lineLeft:true, desc:'둘 중 하나만 선택 가능한 노란 열쇠 그룹입니다.' },

      { empty:true, col:13 },
      { empty:true, col:14 },
    ]
  }
];

const selected = new Set();
const selectedOrder = [];

function buildGrid() {
  const area = document.getElementById('grid-area');
  area.innerHTML = '';

  ROWS.forEach(({ tier, cards }) => {
    const wrap = document.createElement('div');
    wrap.className = `row-wrap row-tier-${tier}`;

    wrap.innerHTML = `
      <div class="tier-bar t${tier}"></div>
      <div class="row-label">
        <span class="tier-num">${tier}</span>
        <span class="tier-icon">▰</span>
      </div>
    `;

    const row = document.createElement('div');
    row.className = 'cards-row';

    cards.forEach(card => {
      const el = document.createElement('div');
      el.className = 'card';

      if (card.empty) {
        el.classList.add('empty');
        el.style.gridColumn = card.col;
        el.innerHTML = '<div class="card-x"></div>';
        row.appendChild(el);
        return;
      }

      const conflict = isGroupConflict(card);
      const disabled = isDisabled(card);

      el.style.gridColumn = card.col;

      if (selected.has(card.id)) el.classList.add('selected');
      if (conflict) el.classList.add('group-conflict');
      if (disabled) el.classList.add('disabled');
      if (card.locked) el.classList.add('locked');
      if (card.key) el.classList.add('key-card');
      if (card.lineTop) el.classList.add('line-top');
      if (card.lineBottom) el.classList.add('line-bottom');
      if (card.lineLeft) el.classList.add('line-left');
      if (card.lineRight) el.classList.add('line-right');

      el.innerHTML = `
        <div class="card-mini-badge">${card.key ? 'KEY' : card.locked ? 'LOCK' : '▣'}</div>
        <div class="card-icon">${card.icon}</div>
        <div class="card-check">✓</div>
        <div class="card-conflict-mark">충돌</div>
        <div class="card-pts">${card.pts}</div>
      `;

      if (!card.locked && !disabled) {
        el.addEventListener('click', () => toggleCard(card.id));
      }

      row.appendChild(el);
    });

    wrap.appendChild(row);
    area.appendChild(wrap);
  });
}

function toggleCard(id) {
  const card = getCard(id);
  if (!card || card.locked || isDisabled(card)) return;

  if (selected.has(id)) {
    selected.delete(id);
    removeFromOrder(id);
    updateAll();
    return;
  }

  if (card.group) {
    getAllCards()
      .filter(c => c.group === card.group)
      .forEach(c => {
        selected.delete(c.id);
        removeFromOrder(c.id);
      });
  }

  selected.add(id);
  selectedOrder.push(id);
  updateAll();
}

function isGroupConflict(card) {
  if (!card.group || selected.has(card.id)) return false;

  return getAllCards().some(c =>
    c.id !== card.id &&
    c.group === card.group &&
    selected.has(c.id)
  );
}

function isDisabled(card) {
  if (card.locked) return true;
  return false;
}

function renderPanel() {
  const list = document.getElementById('panel-list');
  const count = document.getElementById('selected-count');

  count.textContent = selected.size;

  if (selected.size === 0) {
    list.innerHTML = '<div class="panel-empty">지표를 선택하면<br>여기에 표시됩니다</div>';
    return;
  }

  list.innerHTML = '';

  selectedOrder
    .filter(id => selected.has(id))
    .forEach(id => {
      const card = getCard(id);
      const tier = getTier(id);

      const item = document.createElement('div');
      item.className = `panel-item tier-${tier}`;

      item.innerHTML = `
        <div class="panel-score">${card.pts}★</div>
        <div class="panel-icon">${card.icon}</div>
        <div class="panel-content">
          <div class="panel-name">${card.name}</div>
          <div class="panel-desc">${card.desc || ''}</div>
        </div>
        <button class="panel-del">×</button>
      `;

      item.querySelector('.panel-del').addEventListener('click', () => {
        selected.delete(id);
        removeFromOrder(id);
        updateAll();
      });

      list.appendChild(item);
    });
}

function updateTotal() {
  let total = 0;
  selected.forEach(id => {
    const c = getCard(id);
    if (c) total += c.pts;
  });

  document.getElementById('total-pts').textContent = total;
  document.getElementById('warn-text').classList.toggle('visible', total >= 15);
}

function updateAll() {
  buildGrid();
  renderPanel();
  updateTotal();
}

function removeFromOrder(id) {
  const i = selectedOrder.indexOf(id);
  if (i !== -1) selectedOrder.splice(i, 1);
}

function getAllCards() {
  return ROWS.flatMap(r => r.cards);
}

function getCard(id) {
  return getAllCards().find(c => c.id === id);
}

function getTier(id) {
  return ROWS.find(r => r.cards.some(c => c.id === id))?.tier || 1;
}

updateAll();
</script>

</body>
</html>
