<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Endfield CC Simulator</title>

  <link rel="stylesheet" href="style.css"/>
  <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>

<div id="intro-screen">
  <img src="assets/ECC0title.png" alt="intro" />
</div>

<div class="sim-wrapper">

  <header class="sim-header">
    <div class="music-player">
      <span class="music-title">♬ 재점화 실험 작전 OST ♬</span>

      <button id="music-toggle" class="music-toggle" type="button">▶</button>

      <input
        id="music-volume"
        class="music-volume"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0.3"
      />

      <audio id="bgm" src="assets/audio/endfield-contingency-contract-#1.mp3" loop></audio>
      <audio id="sfx-select" src="assets/audio/select.mp3"></audio>
      <audio id="sfx-cancel" src="assets/audio/cancel.mp3"></audio>
    </div>

    <div class="small-title">// 엔드필드 위기 협약 : 재점화 실험 작전</div>
    <div class="main-title">지표 선택</div>
  </header>

  <main class="sim-main">

  <section class="main-left">

      <div class="sim-body">
        <section class="board-wrap">
          <div id="grid-area" class="grid-area"></div>
        </section>
      </div>

      <div class="stats-hud">

        <div class="stats-title">
          // 지표 분포 분석
        </div>

        <div class="stats-pie">
          <div class="pie-chart" id="type-pie"></div>
        </div>

        <div class="stats-bars">

          <div class="block-row team">
            <span class="bar-label">팀</span>
            <span class="bar-value" id="value-team">0</span>
            <div class="block-track" id="blocks-team"></div>
          </div>

          <div class="block-row control">
            <span class="bar-label">조작</span>
            <span class="bar-value" id="value-control">0</span>
            <div class="block-track" id="blocks-control"></div>
          </div>

          <div class="block-row env">
            <span class="bar-label">환경</span>
            <span class="bar-value" id="value-env">0</span>
            <div class="block-track" id="blocks-env"></div>
          </div>

        </div>

      </div>

      <footer class="sim-footer">

        <button
          class="result-btn"
          type="button"
          onclick="window.open('result.html','_blank')"
        >
          ▶ 선택 결과 ◀
        </button>

        <div class="warn-text" id="warn-text">
          ⚠ 현재 지표 난도가 높습니다. 신중하게 행동해 주세요.
        </div>

        <div class="total-score">
          <span class="total-label">총 합계</span>
          <span class="total-num" id="total-pts">0</span>
          <span>★</span>
        </div>

      </footer>

  </section>

    <aside class="side-panel">
      <div class="panel-header">
        <span>선택된 지표</span>
        <button class="panel-reset-btn" onclick="resetSelected()">선택 초기화</button>
        <span id="selected-count">0</span>
      </div>

      <div id="panel-list" class="panel-list"></div>
    </aside>

  </main>

</div>
  
<script src="data.js"></script>
<script src="script.js"></script>
  
</body>
</html>
