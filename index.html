<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Endfield CC Simulator</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="left-panel">

    <!-- Tier 1 -->
    <div class="tier">

      <div class="tier-label red">1</div>

      <div class="tree-row">

        <div class="constraint active">
          <span>A</span>
        </div>

        <div class="line"></div>

        <div class="constraint">
          <span>B</span>
        </div>

        <div class="line"></div>

        <div class="constraint">
          <span>C</span>
        </div>

        <div class="line"></div>

        <div class="constraint locked">
          <span>D</span>
        </div>

      </div>
    </div>

    <!-- Tier 2 -->
    <div class="tier">

      <div class="tier-label orange">2</div>

      <div class="tree-row">

        <div class="constraint">
          <span>E</span>
        </div>

        <div class="line"></div>

        <div class="constraint active">
          <span>F</span>
        </div>

        <div class="line"></div>

        <div class="constraint">
          <span>G</span>
        </div>

        <div class="line"></div>

        <div class="constraint">
          <span>H</span>
        </div>

      </div>
    </div>

    <!-- Tier 3 -->
    <div class="tier">

      <div class="tier-label red">3</div>

      <div class="tree-row">

        <div class="constraint locked">
          <span>I</span>
        </div>

        <div class="line"></div>

        <div class="constraint">
          <span>J</span>
        </div>

        <div class="line"></div>

        <div class="constraint active">
          <span>K</span>
        </div>

      </div>
    </div>

  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">

    <div class="panel-header">
      CONSTRAINT INFO
    </div>

    <div class="info-card">

      <h2>Enemy Attack Up</h2>

      <div class="tag">
        RISK +2
      </div>

      <p>
        모든 적의 공격력이 증가합니다.
      </p>

    </div>

  </div>

</div>

</body>
</html>
