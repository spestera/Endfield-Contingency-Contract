<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>위기 협약 시뮬레이터 — 명일방주: 엔드필드</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="sim-wrapper">

  <!-- Header -->
  <div class="sim-header">
    <div class="title">// <span>위기 협약 재점화 실험 작전</span></div>
    <div class="header-right">
      <div class="pts-display">
        <span class="pts-label">최고 기록</span>
        <span class="pts-num" id="best-num">7</span>
        <span class="pts-label">★</span>
      </div>
    </div>
  </div>

  <!-- Body -->
  <div class="sim-body">

    <!-- Grid -->
    <div class="grid-area" id="grid-area"></div>

    <!-- Side Panel -->
    <div class="side-panel">
      <div class="panel-header">지표 선택</div>
      <div class="panel-list" id="panel-list">
        <div class="panel-empty">지표를 선택하면<br>여기에 표시됩니다</div>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <div class="sim-footer">
    <div class="footer-left">
      <div class="best-record">최고 기록 <span>7</span> ★</div>
    </div>
    <div class="footer-center">
      <span class="warn-text" id="warn-text">⚠ 현재 지표 난도가 높습니다. 신중하게 행동해 주세요.</span>
    </div>
    <div class="footer-right">
      <button class="btn-reset" onclick="resetAll()">↺ 선택 초기화</button>
      <div class="total-pts-display">
        <span class="total-num" id="total-pts">0</span>
        <span class="total-star">★</span>
      </div>
      <button class="btn-start">작전 시작 ▶</button>
    </div>
  </div>

</div>

<script>
/* ────────────────────────────────────────────
   카드 데이터
   conflict: true  → 충돌 (클릭 불가, 흐림)
   locked: true    → 잠금 (추후 해금)
   empty: true     → 빈 슬롯
   pts             → 난이도 포인트
──────────────────────────────────────────── */
const ROWS = [
  /* ── 난이도 1 ── */
  {
    tier: 1,
    cards: [
      { id:'1-1',  icon:'⚔',  name:'팀: 피로 I',          pts:3, desc:'오퍼레이터의 일반 공격 피해 -70%' },
      { id:'1-2',  icon:'🛡',  name:'조작: 보호벽 I',       pts:1, desc:'각 적은 5초마다 방어 불능 또는 같은 유형의 아츠 부착을 1회만 부여받을 수 있음' },
      { id:'1-3',  icon:'⏱',  name:'팀: 부러진 칼날 I',    pts:1, desc:'오퍼레이터가 궁극기를 1회 사용할 때마다, 이후 사용하는 궁극기 피해 -50%' },
      { id:'1-4',  icon:'💢',  name:'팀: 부러진 칼날 II',   pts:2, desc:'오퍼레이터가 궁극기를 1회 사용할 때마다, 이후 사용하는 궁극기 피해 -100%' },
      { id:'1-5',  icon:'⚔',  name:'팀: 피로 II',          pts:1, desc:'오퍼레이터 일반 공격 속도 -30%' },
      { id:'1-6',  icon:'🗡',  name:'환경: 속박 I',          pts:3, desc:'회피 불가' },
      { id:'1-7',  icon:'⚔',  name:'팀: 참수 I',            pts:1, desc:'오퍼레이터 체력 -30%' },
      { id:'1-8',  icon:'🩺',  name:'환경: 쇠퇴 I',          pts:1, desc:'웨이브 사이에 치유 물질이 1개만 생성' },
      { id:'1-9',  icon:'⛔',  name:'조작: 전략 제한 I',     pts:1, desc:'오퍼레이터 배치 인원 -1' },
      { id:'1-10', icon:'🌐',  name:'환경: 잠식 I',          pts:1, desc:'적 이동 속도 +15%' },
      { id:'1-11', icon:'⚔',  name:'팀: 무거운 짐 I',       pts:1, desc:'오퍼레이터 배치 코스트 +5' },
      { id:'1-12', icon:'🩺',  name:'조작: 자원 부족 I',     pts:1, desc:'전투 시작 시 드론 2개 -' },
      { id:'1-13', icon:'🔒',  name:'???',                   pts:2, locked:true },
      { id:'1-14', icon:'🔒',  name:'???',                   pts:3, locked:true },
    ]
  },
  /* ── 난이도 2 ── */
  {
    tier: 2,
    cards: [
      { id:'2-1',  icon:'⚔',  name:'팀: 피로 III',         pts:2, desc:'오퍼레이터 일반 공격 속도 -30%, 피해 -30%' },
      { id:'2-2',  icon:'🛡',  name:'조작: 보호벽 II',      pts:1, desc:'적이 받는 피해 -20%' },
      { id:'2-3',  icon:'⏱',  name:'팀: 부러진 칼날 III',  pts:1, desc:'궁극기 피해 -30%' },
      { id:'2-4',  icon:'💢',  name:'팀: 부러진 칼날 IV',   pts:2, desc:'궁극기 재사용 대기 +30%' },
      { id:'2-5',  icon:'🩺',  name:'환경: 쇠퇴 II',         pts:2, desc:'웨이브 사이에 치유 물질이 생성되지 않음' },
      { id:'2-6',  icon:'🗡',  name:'환경: 속박 II',         pts:1, desc:'아츠 공격 범위 -20%' },
      { id:'2-7',  icon:'⚔',  name:'팀: 참수 II',           pts:1, desc:'오퍼레이터 체력 -50%' },
      { id:'2-8',  icon:'🎯',  name:'목표: 핵심 타격 II',   pts:1, desc:'핵심 적 처치 시 지역 보안도 +2' },
      { id:'2-9',  icon:'⛔',  name:'조작: 전략 제한 II',   pts:2, desc:'오퍼레이터 배치 인원 -2' },
      { id:'2-10', icon:'🌐',  name:'환경: 잠식 II',         pts:1, desc:'적 이동 속도 +30%' },
      { id:'2-11', icon:'⚔',  name:'팀: 무거운 짐 II',      pts:1, desc:'오퍼레이터 배치 코스트 +10' },
      { id:'2-12', icon:'🩺',  name:'조작: 자원 부족 II',    pts:1, desc:'전투 시작 시 드론 4개 -' },
      { id:'2-13', icon:'🔒',  name:'???',                   pts:2, locked:true },
      { id:'2-14', icon:'🔒',  name:'???',                   pts:3, locked:true },
    ]
  },
  /* ── 난이도 3 ── */
  {
    tier: 3,
    cards: [
      { id:'3-1',  icon:'⚔',  name:'팀: 피로 IV',          pts:3, desc:'오퍼레이터 일반 공격 피해 -90%' },
      { id:'3-2',  icon:'🌐',  name:'환경: 공황',            pts:2, desc:'아군 공격력 -20%', conflict:true },
      { id:'3-3',  icon:'💢',  name:'팀: 부러진 칼날 V',    pts:2, desc:'궁극기 사용 불가', conflict:true },
      { id:'3-4',  icon:'🩺',  name:'환경: 쇠퇴 III',        pts:2, desc:'치유 완전 차단', conflict:true },
      { id:'3-5',  icon:'🗡',  name:'목표: 섬멸',            pts:3, desc:'모든 적 처치 요구' },
      { id:'3-6',  icon:'🎯',  name:'목표: 핵심 타격 III',  pts:2, desc:'핵심 적 처치 시 지역 보안도 +3' },
      { id:'3-7',  icon:'⛔',  name:'조작: 봉인 I',          pts:2, desc:'특정 오퍼레이터 사용 불가' },
      { id:'3-8',  icon:'🔒',  name:'???',                   pts:3, locked:true },
      { id:'3-9',  icon:'🔒',  name:'???',                   pts:3, locked:true },
      { id:'3-10', icon:'',    name:'',                      pts:0, empty:true },
      { id:'3-11', icon:'',    name:'',                      pts:0, empty:true },
      { id:'3-12', icon:'',    name:'',                      pts:0, empty:true },
      { id:'3-13', icon:'',    name:'',                      pts:0, empty:true },
      { id:'3-14', icon:'',    name:'',                      pts:0, empty:true },
    ]
  }
];

/* ────────────────────────────────────────────
   상태
──────────────────────────────────────────── */
const selected = new Set();

/* ────────────────────────────────────────────
   그리드 렌더
──────────────────────────────────────────── */
function buildGrid() {
  const area = document.getElementById('grid-area');
  area.innerHTML = '';

  ROWS.forEach(({ tier, cards }) => {
    const wrap = document.createElement('div');
    wrap.className = 'row-wrap';

    /* 난이도 컬러 바 */
    const bar = document.createElement('div');
    bar.className = `tier-bar t${tier}`;
    wrap.appendChild(bar);

    /* 번호 레이블 */
    const label = document.createElement('div');
    label.className = 'row-label';
    label.innerHTML = `<span class="tier-num">${tier}</span><span class="tier-star">★</span>`;
    wrap.appendChild(label);

    /* 카드 행 */
    const row = document.createElement('div');
    row.className = 'cards-row';

    cards.forEach(card => {
      const el = document.createElement('div');
      el.className = 'card';

      if (card.empty) {
        el.classList.add('empty');
        row.appendChild(el);
        return;
      }
      if (card.locked)   el.classList.add('locked');
      if (card.conflict) el.classList.add('conflict');
      if (selected.has(card.id)) el.classList.add('selected');

      /* 툴팁 */
      if (card.desc && !card.locked) {
        el.setAttribute('data-tip', card.desc);
      }

      /* 내부 HTML */
      el.innerHTML = `
        <div class="card-tier-badge badge-t${tier}">${tier}</div>
        <div class="card-icon">${card.icon}</div>
        <div class="card-check">✓</div>
        ${!card.locked ? `<div class="card-pts">${card.pts}</div>` : ''}
        <div class="card-bottom">${card.conflict ? '충돌' : card.locked ? 'LOCKED' : ''}</div>
      `;

      /* 클릭 이벤트 */
      if (!card.locked && !card.conflict) {
        el.addEventListener('click', () => toggleCard(card.id));
      }

      row.appendChild(el);
    });

    wrap.appendChild(row);
    area.appendChild(wrap);
  });
}

/* ────────────────────────────────────────────
   토글
──────────────────────────────────────────── */
function toggleCard(id) {
  if (selected.has(id)) selected.delete(id);
  else selected.add(id);
  updateAll();
}

/* ────────────────────────────────────────────
   패널 렌더
──────────────────────────────────────────── */
function updatePanel() {
  const list = document.getElementById('panel-list');

  if (selected.size === 0) {
    list.innerHTML = '<div class="panel-empty">지표를 선택하면<br>여기에 표시됩니다</div>';
    return;
  }

  list.innerHTML = '';
  selected.forEach(id => {
    const card = getCard(id);
    if (!card) return;

    const tier = getTier(id);
    const item = document.createElement('div');
    item.className = 'panel-item';
    item.innerHTML = `
      <div class="panel-item-icon">${card.icon}</div>
      <div class="panel-item-content">
        <div class="panel-item-name">${card.name}</div>
        <div class="panel-item-desc">${card.desc || ''}</div>
      </div>
      <div class="panel-item-pts p${tier}">${card.pts}</div>
      <button class="panel-del" title="제거">✕</button>
    `;
    item.querySelector('.panel-del').addEventListener('click', () => {
      selected.delete(id);
      updateAll();
    });
    list.appendChild(item);
  });
}

/* ────────────────────────────────────────────
   총합 & 경고
──────────────────────────────────────────── */
function updateTotal() {
  let total = 0;
  selected.forEach(id => {
    const c = getCard(id);
    if (c) total += c.pts;
  });

  document.getElementById('total-pts').textContent = total;

  const warn = document.getElementById('warn-text');
  if (total >= 15) warn.classList.add('visible');
  else warn.classList.remove('visible');
}

/* ────────────────────────────────────────────
   전체 갱신
──────────────────────────────────────────── */
function updateAll() {
  buildGrid();
  updatePanel();
  updateTotal();
}

/* ────────────────────────────────────────────
   초기화
──────────────────────────────────────────── */
function resetAll() {
  selected.clear();
  updateAll();
}

/* ────────────────────────────────────────────
   유틸
──────────────────────────────────────────── */
function getAllCards() {
  return ROWS.flatMap(r => r.cards);
}

function getCard(id) {
  return getAllCards().find(c => c.id === id);
}

function getTier(id) {
  const row = ROWS.find(r => r.cards.some(c => c.id === id));
  return row ? row.tier : 1;
}

/* ────────────────────────────────────────────
   초기 실행
──────────────────────────────────────────── */
updateAll();
</script>

</body>
</html>
