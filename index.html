<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Endfield CC</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">

  <div class="header">
    ENDFIELD / CONTINGENCY CONTRACT
  </div>

  <div class="board">

    <!-- LINES -->
    <svg class="lines">

      <!-- top row -->
      <line x1="90" y1="70" x2="170" y2="70"/>
      <line x1="250" y1="70" x2="330" y2="70"/>
      <line x1="410" y1="70" x2="490" y2="70"/>

      <!-- vertical -->
      <line x1="170" y1="70" x2="170" y2="170"/>
      <line x1="330" y1="70" x2="330" y2="170"/>

      <!-- middle -->
      <line x1="170" y1="170" x2="250" y2="170"/>
      <line x1="330" y1="170" x2="410" y2="170"/>

      <!-- vertical -->
      <line x1="250" y1="170" x2="250" y2="270"/>
      <line x1="410" y1="170" x2="410" y2="270"/>

      <!-- bottom -->
      <line x1="250" y1="270" x2="330" y2="270"/>
      <line x1="410" y1="270" x2="490" y2="270"/>

    </svg>

    <!-- NODES -->

    <div class="node active" style="left:50px; top:30px;">
      A
    </div>

    <div class="node" style="left:210px; top:30px;">
      B
    </div>

    <div class="node" style="left:370px; top:30px;">
      C
    </div>

    <div class="node locked" style="left:530px; top:30px;">
      D
    </div>

    <div class="node" style="left:210px; top:130px;">
      E
    </div>

    <div class="node active" style="left:370px; top:130px;">
      F
    </div>

    <div class="node locked" style="left:210px; top:230px;">
      G
    </div>

    <div class="node" style="left:370px; top:230px;">
      H
    </div>

    <div class="node" style="left:530px; top:230px;">
      I
    </div>

  </div>

  <!-- SELECTED -->

  <div class="selected-wrap">

    <div class="selected-title">
      SELECTED
    </div>

    <div class="selected-list">

      <div class="selected-item">
        Enemy ATK Up
      </div>

      <div class="selected-item">
        Max HP Down
      </div>

      <div class="selected-item">
        Risk +2
      </div>

    </div>

  </div>

</div>

</body>
</html>
