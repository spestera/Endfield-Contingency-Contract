<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Endfield CC Simulator</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

  <div class="top-bar">
    ENDFIELD / CONTINGENCY CONTRACT
  </div>

  <!-- TREE BOARD -->
  <div class="board">

    <!-- CONNECTION LINES -->
    <svg class="lines">

      <!-- row 1 -->
      <line x1="120" y1="80" x2="220" y2="80" />
      <line x1="320" y1="80" x2="420" y2="80" />
      <line x1="520" y1="80" x2="620" y2="80" />

      <!-- row 2 -->
      <line x1="220" y1="80" x2="220" y2="220" />
      <line x1="420" y1="80" x2="420" y2="220" />

      <line x1="220" y1="220" x2="320" y2="220" />
      <line x1="420" y1="220" x2="520" y2="220" />

      <!-- row 3 -->
      <line x1="320" y1="220" x2="320" y2="360" />
      <line x1="520" y1="220" x2="520" y2="360" />

      <line x1="320" y1="360" x2="420" y2="360" />
      <line x1="520" y1="360" x2="620" y2="360" />

    </svg>

    <!-- NODES -->

    <!-- TIER 1 -->
    <div class="node active" style="left:80px; top:50px;">
      A
    </div>

    <div class="node" style="left:280px; top:50px;">
      B
    </div>

    <div class="node" style="left:480px; top:50px;">
      C
    </div>

    <div class="node locked" style="left:680px; top:50px;">
      D
    </div>

    <!-- TIER 2 -->
    <div class="node" style="left:280px; top:190px;">
      E
    </div>

    <div class="node active" style="left:480px; top:190px;">
      F
    </div>

    <!-- TIER 3 -->
    <div class="node locked" style="left:380px; top:330px;">
      G
    </div>

    <div class="node" style="left:580px; top:330px;">
      H
    </div>

  </div>

  <!-- SELECTED -->
  <div class="selected-panel">

    <div class="selected-title">
      SELECTED CONSTRAINTS
    </div>

    <div class="selected-list">

      <div class="selected-item">
        Enemy ATK Up
      </div>

      <div class="selected-item">
        DP Recovery Down
      </div>

      <div class="selected-item">
        Risk +2
      </div>

    </div>

  </div>

</div>

</body>
</html>
