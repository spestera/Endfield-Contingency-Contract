<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>위기 협약 시뮬레이터 — 명일방주: 엔드필드</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="sim-wrapper">

  <header class="sim-header">
    <div class="small-title">// 위기 협약 재점화 실험 작전</div>
    <h1>지표 선택</h1>
  </header>

  <main class="sim-body">

    <section class="board-wrap">
      <div class="grid-area" id="grid-area"></div>
    </section>

    <aside class="side-panel">
      <div class="panel-header">
        <span>선택된 지표</span>
        <select id="panel-sort-sel" onchange="renderPanel()">
          <option value="order">선택 순서</option>
          <option value="tier">난이도순</option>
          <option value="pts">점수순</option>
        </select>
      </div>

      <div class="panel-list" id="panel-list">
        <div class="panel-empty">지표를 선택하면<br>여기에 표시됩니다</div>
      </div>
    </aside>

  </main>

  <footer class="sim-footer">
    <div class="best-record">
      <span class="best-num">7</span>
      <span>최고 기록</span>
    </div>

    <div class="warn-text" id="warn-text">
      ⚠ 현재 지표 난도가 높습니다. 신중하게 행동해 주세요.
    </div>

    <div class="total-score">
      <span id="total-pts">0</span>
      <span>★</span>
    </div>
  </footer>

</div>

<script>
const ROWS = [
  {
    tier: 1,
    cards: [
      { id:'1-1', icon:'▦', name:'팀: 피로 I', pts:1, desc:'오퍼레이터 일반 공격 피해 -30%', group:'fatigue' },
      { id:'1-2', icon:'▴', name:'환경: 압박 I', pts:1, desc:'적 공격 패턴 강화', group:'pressure' },
      { id:'1-3', icon:'◴', name:'팀: 부러진 칼날 I', pts:1, desc:'궁극기 피해 -30%', group:'blade' },
      { id:'1-4', icon:'✹', name:'환경: 파열 I', pts:1, desc:'적 피해량 증가', group:'rupture' },
      { id:'1-5', icon:'▣', name:'조작: 제한 I', pts:1, desc:'전투 조건 제한', group:'limit' },
      { id:'1-6', icon:'◒', name:'환경: 속박 I', pts:1, desc:'회피 성능 감소', group:'bind' },
      { id:'1-7', icon:'✚', name:'환경: 쇠퇴 I', pts:1, desc:'치유 물질 1개만 생성', group:'decay' },
      { id:'1-8', icon:'◎', name:'목표: 핵심 타격 I', pts:1, desc:'핵심 적 강화', group:'target' },
      { id:'1-9', icon:'▧', name:'조작: 자원 부족 I', pts:1, desc:'초기 자원 감소', group:'resource' },
      { empty:true },
      { empty:true },
      { empty:true },
      { id:'1-13', icon:'□', name:'잠금 지표 I', pts:2, locked:true },
      { id:'1-14', icon:'◉', name:'해금 지표', pts:3, yellowLock:true, requiresAny:['3-11','3-12'], desc:'노란 열쇠 지표 중 하나를 선택해야 활성화됩니다.' },
    ]
  },
  {
    tier: 2,
    cards: [
      { id:'2-1', icon:'▦', name:'팀: 피로 II', pts:2, desc:'오퍼레이터 일반 공격 피해 -50%', group:'fatigue' },
      { id:'2-2', icon:'▴', name:'환경: 압박 II', pts:2, desc:'적 공격 패턴 추가 강화', group:'pressure' },
      { id:'2-3', icon:'◴', name:'팀: 부러진 칼날 II', pts:2, desc:'궁극기 피해 -50%', group:'blade' },
      { id:'2-4', icon:'✹', name:'환경: 파열 II', pts:2, desc:'적 피해량 추가 증가', group:'rupture' },
      { id:'2-5', icon:'▣', name:'조작: 제한 II', pts:2, desc:'전투 조건 추가 제한', group:'limit' },
      { id:'2-6', icon:'◒', name:'환경: 속박 II', pts:2, desc:'회피 불가', group:'bind' },
      { empty:true },
      { id:'2-8', icon:'✚', name:'환경: 쇠퇴 II', pts:2, desc:'치유 물질 생성 감소', group:'decay' },
      { id:'2-9', icon:'◎', name:'목표: 핵심 타격 II', pts:2, desc:'핵심 적 추가 강화', group:'target' },
      { id:'2-10', icon:'✹', name:'환경: 파열 III', pts:2, desc:'강화 적 추가 출현', group:'rupture-extra' },
      { id:'2-11', icon:'▧', name:'조작: 자원 부족 II', pts:2, desc:'초기 자원 추가 감소', group:'resource' },
      { empty:true },
      { id:'2-13', icon:'◴', name:'잠금 지표 II', pts:2, locked:true },
      { id:'2-14', icon:'◉', name:'잠금 지표 III', pts:3, locked:true },
    ]
  },
  {
    tier: 3,
    cards: [
      { id:'3-1', icon:'▦', name:'팀: 피로 III', pts:3, desc:'오퍼레이터 일반 공격 피해 -70%', group:'fatigue' },
      { empty:true },
      { empty:true },
      { id:'3-4', icon:'✹', name:'환경: 파열 IV', pts:3, desc:'적 공격력 대폭 증가', group:'rupture' },
      { empty:true },
      { empty:true },
      { id:'3-7', icon:'◒', name:'환경: 속박 III', pts:3, desc:'회피 불가', group:'bind' },
      { empty:true },
      { id:'3-9', icon:'⚔', name:'팀: 참수 I', pts:3, desc:'오퍼레이터 체력 대폭 감소' },
      { id:'3-10', icon:'♟', name:'조작: 봉인 I', pts:3, desc:'특정 오퍼레이터 사용 불가' },
      { id:'3-11', icon:'🔑', name:'특수 열쇠 I', pts:3, key:true, group:'yellow-key', desc:'해금 지표 선택 조건을 충족합니다.' },
      { id:'3-12', icon:'🗝', name:'특수 열쇠 II', pts:3, key:true, group:'yellow-key', desc:'해금 지표 선택 조건을 충족합니다.' },
      { empty:true },
      { empty:true },
    ]
  }
];

const selected = new Set();
const selectedOrder = [];

function buildGrid() {
  const area = document.getElementById('grid-area');
  area.innerHTML = '';

  ROWS.forEach(({ tier, cards }) => {
    const wrap = document.createElement('div');
    wrap.className = `row-wrap row-tier-${tier}`;

    const bar = document.createElement('div');
    bar.className = `tier-bar t${tier}`;
    wrap.appendChild(bar);

    const label = document.createElement('div');
    label.className = 'row-label';
    label.innerHTML = `
      <span class="tier-num">${tier}</span>
      <span class="tier-icon">▰</span>
    `;
    wrap.appendChild(label);

    const row = document.createElement('div');
    row.className = 'cards-row';

    cards.forEach(card => {
      const el = document.createElement('div');
      el.className = 'card';

      if (card.empty) {
        el.classList.add('empty');
        el.innerHTML = '<div class="card-x"></div>';
        row.appendChild(el);
        return;
      }

      const disabled = isDisabled(card);

      if (selected.has(card.id)) el.classList.add('selected');
      if (card.locked) el.classList.add('locked');
      if (card.key) el.classList.add('key-card');
      if (card.yellowLock) el.classList.add('yellow-lock');
      if (disabled) el.classList.add('disabled');

      el.innerHTML = `
        <div class="card-mini-badge">${card.key ? 'KEY' : card.yellowLock ? 'LOCK' : '▣'}</div>
        <div class="card-icon">${card.icon}</div>
        <div class="card-check">✓</div>
        <div class="card-pts">${card.pts}</div>
      `;

      if (!card.locked) {
        el.addEventListener('click', () => toggleCard(card.id));
      }

      row.appendChild(el);
    });

    wrap.appendChild(row);
    area.appendChild(wrap);
  });
}

function toggleCard(id) {
  const card = getCard(id);
  if (!card || card.empty || card.locked) return;

  if (isDisabled(card)) return;

  if (selected.has(id)) {
    selected.delete(id);
    removeFromOrder(id);

    removeCardsDependingOn(id);

    updateAll();
    return;
  }

  if (card.group) {
    getAllCards()
      .filter(c => c.id !== id && c.group === card.group)
      .forEach(c => {
        selected.delete(c.id);
        removeFromOrder(c.id);
        removeCardsDependingOn(c.id);
      });
  }

  selected.add(id);
  selectedOrder.push(id);
  updateAll();
}

function isDisabled(card) {
  if (card.locked) return true;

  if (card.requiresAny) {
    return !card.requiresAny.some(id => selected.has(id));
  }

  return false;
}

function removeCardsDependingOn(removedId) {
  getAllCards().forEach(card => {
    if (card.requiresAny && card.requiresAny.includes(removedId)) {
      const stillValid = card.requiresAny.some(id => selected.has(id));
      if (!stillValid) {
        selected.delete(card.id);
        removeFromOrder(card.id);
      }
    }
  });
}

function renderPanel() {
  const list = document.getElementById('panel-list');

  if (selected.size === 0) {
    list.innerHTML = '<div class="panel-empty">지표를 선택하면<br>여기에 표시됩니다</div>';
    return;
  }

  const sortMode = document.getElementById('panel-sort-sel')?.value || 'order';
  let ids = [...selected];

  if (sortMode === 'order') {
    ids = selectedOrder.filter(id => selected.has(id));
  } else if (sortMode === 'tier') {
    ids.sort((a, b) => getTier(a) - getTier(b));
  } else if (sortMode === 'pts') {
    ids.sort((a, b) => (getCard(b)?.pts || 0) - (getCard(a)?.pts || 0));
  }

  list.innerHTML = '';

  ids.forEach(id => {
    const card = getCard(id);
    const tier = getTier(id);

    const item = document.createElement('div');
    item.className = `panel-item tier-${tier}`;
    item.innerHTML = `
      <div class="panel-score">${card.pts}★</div>
      <div class="panel-icon">${card.icon}</div>
      <div class="panel-content">
        <div class="panel-name">${card.name}</div>
        <div class="panel-desc">${card.desc || ''}</div>
      </div>
      <button class="panel-del">🗑</button>
    `;

    item.querySelector('.panel-del').addEventListener('click', () => {
      selected.delete(id);
      removeFromOrder(id);
      removeCardsDependingOn(id);
      updateAll();
    });

    list.appendChild(item);
  });
}

function updateTotal() {
  let total = 0;
  selected.forEach(id => {
    const c = getCard(id);
    if (c) total += c.pts;
  });

  document.getElementById('total-pts').textContent = total;
  document.getElementById('warn-text').classList.toggle('visible', total >= 15);
}

function updateAll() {
  buildGrid();
  renderPanel();
  updateTotal();
}

function resetAll() {
  selected.clear();
  selectedOrder.length = 0;
  updateAll();
}

function removeFromOrder(id) {
  const i = selectedOrder.indexOf(id);
  if (i !== -1) selectedOrder.splice(i, 1);
}

function getAllCards() {
  return ROWS.flatMap(r => r.cards);
}

function getCard(id) {
  return getAllCards().find(c => c.id === id);
}

function getTier(id) {
  return ROWS.find(r => r.cards.some(c => c.id === id))?.tier || 1;
}

updateAll();
</script>

</body>
</html>
